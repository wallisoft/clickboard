name: Release

# Push a tag like v2.5.1 and this builds the Linux package and the Windows
# installer, then publishes both as a GitHub Release. The tag must match
# VERSION in clickboard.py, so a release can never be mislabelled.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match VERSION in clickboard.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 '^VERSION' clickboard.py | cut -d'"' -f2)
          echo "tag=$TAG code=$CODE"
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::Tag v$TAG doesn't match VERSION $CODE in clickboard.py"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          python3 -m py_compile clickboard.py
          python3 -m compileall -q clickboard_core
          bash -n install.sh
          tar czf clickboard-linux.tar.gz --exclude=__pycache__ install.sh clickboard.py clickboard_core requirements.txt clickboard.desktop README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: clickboard-linux.tar.gz

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Make the app icon (the green status dot)
        run: |
          python -c "from PIL import Image, ImageDraw; im=Image.new('RGBA',(256,256),(0,0,0,0)); d=ImageDraw.Draw(im); d.ellipse((24,24,232,232),fill=(34,197,94,255),outline=(255,255,255,220),width=12); im.save('packaging/clickboard.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build Clickboard.exe
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name Clickboard `
            --icon packaging/clickboard.ico `
            --hidden-import pystray._win32 `
            --hidden-import win32clipboard --hidden-import win32con `
            --hidden-import PIL.ImageGrab `
            clickboard.py
      - name: Build Clickboard-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.check.outputs.version }}" packaging\clickboard.iss
      - name: Build Clickboard.msix (Microsoft Store)
        # Switches itself on once the Store identity is added as repository variables
        # (Settings > Secrets and variables > Actions > Variables).
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        env:
          ID_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $ver = "${{ needs.check.outputs.version }}.0"
          New-Item -ItemType Directory -Force msix\Assets | Out-Null
          Copy-Item dist\Clickboard.exe msix\
          python -c "from PIL import Image, ImageDraw; [ (lambda n,sz: (lambda im,d: (d.ellipse((sz*0.08,sz*0.08,sz*0.92,sz*0.92),fill=(34,197,94,255)), im.save('msix/Assets/'+n)))(*(lambda im: (im, ImageDraw.Draw(im)))(Image.new('RGBA',(sz,sz),(0,0,0,0)))))(n,sz) for n,sz in (('Square44x44Logo.png',44),('Square150x150Logo.png',150),('StoreLogo.png',50)) ]"
          (Get-Content packaging\AppxManifest.xml -Raw) `
            -replace '@VERSION@', $ver `
            -replace '@IDENTITY_NAME@', $env:ID_NAME `
            -replace '@PUBLISHER@', $env:PUBLISHER `
            -replace '@PUBLISHER_DISPLAY@', $env:PUBLISHER_DISPLAY |
            Set-Content msix\AppxManifest.xml -Encoding UTF8
          $mk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $mk.FullName pack /d msix /p Clickboard.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: ignore
          path: |
            packaging/Output/Clickboard-Setup.exe
            Clickboard.msix

  release:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make sure the Windows installer made it
        run: |
          find . -name Clickboard-Setup.exe | grep -q . || { echo "::error::Clickboard-Setup.exe is missing"; exit 1; }
          find . -name 'Clickboard-Setup.exe' -o -name 'clickboard-linux.tar.gz' -o -name 'Clickboard.msix'
      - uses: softprops/action-gh-release@v2
        with:
          name: Clickboard ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            **/clickboard-linux.tar.gz
            **/Clickboard-Setup.exe
            **/Clickboard.msix
