name: CLA

# Asks each new contributor to sign CLA.md once, by commenting on their pull
# request. Signatures are stored in this repository (signatures/cla.json).
# Nothing from the pull request is checked out or run here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/wallisoft/clickboard/blob/main/CLA.md"
          path-to-signatures: "signatures/cla.json"
          branch: "main"
          allowlist: "wallisoft,dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >
            Thanks for your contribution! Before we can merge it, please read our
            [Contributor Licence Agreement](https://github.com/wallisoft/clickboard/blob/main/CLA.md)
            and sign it by replying to this pull request with the comment below. You only need to do this once.
          custom-allsigned-prcomment: "Thanks, the CLA is signed. We'll review your pull request soon."
